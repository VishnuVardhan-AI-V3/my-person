<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>For Jaanu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&family=Pinyon+Script&display=swap');
:root{--bg:#070a12;--ink:#f4ece6;--dim:#a8a3b3;--gold:#d9bb8c;--rose:#e58aa3;--line:rgba(217,187,140,.32)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse 80% 55% at 50% 108%,#4a1c3c 0%,#151429 50%,var(--bg) 85%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:-20%;z-index:0;background:radial-gradient(circle at 25% 30%,rgba(229,138,163,.09),transparent 40%),radial-gradient(circle at 75% 65%,rgba(217,187,140,.08),transparent 40%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.1)}}
#dust{position:fixed;inset:0;z-index:1;pointer-events:none}
.d{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px rgba(217,187,140,.5);opacity:0;animation:up linear infinite}
@keyframes up{10%{opacity:.7}90%{opacity:.4}to{transform:translate(24px,-108dvh);opacity:0}}
.frame{position:fixed;inset:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));border:1px solid var(--line);pointer-events:none;z-index:40}
.frame::before{content:"";position:absolute;inset:5px;border:1px solid rgba(217,187,140,.12)}
#line{position:fixed;left:14px;right:14px;top:calc(14px + env(safe-area-inset-top));height:2px;z-index:45}
#line i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width 1s ease}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:64px 36px 110px;overflow:hidden;opacity:0;visibility:hidden;transition:opacity 1.3s,visibility 0s 1.3s;z-index:10}
.scene.on{opacity:1;visibility:visible;transition-delay:0s}
.box{max-width:720px;text-align:center}
.kicker{font-family:Jost,sans-serif;font-weight:300;font-size:clamp(11px,2.6vw,13px);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.rule{width:44px;height:1px;background:var(--gold);margin:0 auto 24px;opacity:.7}
.big{font-weight:300;font-size:clamp(38px,9vw,84px);line-height:1.08;letter-spacing:-.01em}
.big em{color:var(--rose)}
.w{display:inline-block;opacity:0;transform:translateY(12px);filter:blur(6px)}
.on .w{animation:wd 1.1s forwards}
@keyframes wd{to{opacity:1;transform:none;filter:none}}
.mid{font-size:clamp(21px,4.2vw,32px);line-height:1.55;color:var(--dim);font-weight:300;margin-top:24px}
.quote{font-style:italic;font-weight:300;font-size:clamp(28px,5.6vw,50px);line-height:1.3}
/* intro */
.seal{width:min(84px,14dvh);aspect-ratio:1;margin:0 auto 28px;color:var(--rose);filter:drop-shadow(0 0 16px rgba(229,138,163,.6));animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.1)}24%{transform:scale(1)}36%{transform:scale(1.06)}}
.script{font-family:'Pinyon Script',cursive;font-size:clamp(76px,21vw,150px);line-height:1.05;color:var(--ink);text-shadow:0 0 40px rgba(229,138,163,.4);padding:0 .1em}
.hint{font-family:Jost,sans-serif;font-weight:300;font-size:13px;letter-spacing:.2em;color:var(--dim);margin-top:26px}
/* memory */
.mem{display:flex;flex-direction:column;align-items:center}
.card{width:min(270px,66vw,40dvh);padding:11px;border:1px solid var(--line);border-radius:999px 999px 6px 6px;background:rgba(255,255,255,.035);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.arch{aspect-ratio:3/4;border-radius:999px 999px 3px 3px;background:var(--g);position:relative;overflow:hidden;display:grid;place-items:center}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.arch svg{width:34%;color:rgba(255,255,255,.85);filter:drop-shadow(0 4px 14px rgba(0,0,0,.3));position:relative}
.arch::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 15%,rgba(255,255,255,.28),transparent 50%)}
.cap{font-style:italic;font-weight:400;font-size:clamp(28px,6vw,38px);margin-top:22px;text-align:center;line-height:1.15}
.note{margin-top:10px;font-family:Jost,sans-serif;font-weight:300;letter-spacing:.06em;color:var(--dim);font-size:clamp(14px,3.4vw,16px);text-align:center;max-width:320px}
/* letter */
.letter p{font-size:clamp(21px,4.4vw,32px);line-height:1.5;font-weight:300;margin-bottom:.8em;opacity:0;animation:none}
.on .letter p{animation:ln 1.6s forwards}
@keyframes ln{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.letter p:last-child{color:var(--gold);font-style:italic}
/* final */
.cons{width:min(210px,50vw,26dvh);margin:0 auto 18px;overflow:visible}
.cons path{fill:none;stroke:var(--rose);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;filter:drop-shadow(0 0 6px var(--rose))}
.on .cons path{animation:dr 4.5s .6s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.fin{font-weight:300;font-size:clamp(30px,6.4vw,54px);line-height:1.2;margin-top:8px}
.fin em{color:var(--gold)}
/* nav */
.nav{position:fixed;bottom:calc(34px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:60}
button{font-family:Jost,sans-serif;font-weight:300;font-size:13px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:var(--ink);background:rgba(7,10,18,.6);border:1px solid var(--line);border-radius:40px;padding:14px 30px;backdrop-filter:blur(10px);transition:.3s}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#next,#start{background:var(--gold);border-color:var(--gold);color:#1a1020;font-weight:400}
#back{padding:14px 20px}
#snd{position:fixed;top:calc(28px + env(safe-area-inset-top));right:26px;z-index:60;padding:8px 14px;font-size:11px}
@media(max-width:600px){.scene{padding:60px 26px 104px}.nav{bottom:calc(30px + env(safe-area-inset-bottom))}}
@media(max-height:560px){.scene{padding:40px 28px 80px}.big{font-size:clamp(26px,8vh,48px)}.mid{margin-top:10px;font-size:clamp(16px,4.6vh,22px)}.card{width:min(180px,34dvh)}.seal{width:50px;margin-bottom:8px}.script{font-size:64px}.cap{margin-top:10px;font-size:24px}.kicker{margin-bottom:10px}.nav{bottom:18px}.letter p{font-size:16px;margin-bottom:.4em}.hint{margin-top:10px}}
@media(min-width:1000px) and (min-height:700px){.card{width:min(340px,46dvh)}.cap{font-size:44px}.note{font-size:18px;max-width:460px}.mid{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.w,.letter p{opacity:1;transform:none;filter:none}.cons path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="frame"></div>
<div id="line"><i></i></div>
<div id="dust"></div>
<main id="stage"></main>
<button id="snd" hidden>Music on</button>
<div class="nav"><button id="back" aria-label="Back" hidden>←</button><button id="next" hidden>Continue</button></div>

<script>
/* ============ EDIT ME ============ */
const NAME  = "Jaanu";
const MUSIC = "";                       // e.g. "song.mp3" (same folder as this file)
const PHOTOS = ["", "", "", ""];        // e.g. ["us1.jpg","us2.jpg","us3.jpg","us4.jpg"]
const FROM  = "";                       // e.g. "Yours, Ravi"  (leave "" to hide)
/* ================================= */

const HEART=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
let pi=0;
const M=(cap,note,g)=>({t:"m",cap,note,g,p:PHOTOS[pi++]||""});
const S=[
 {t:"intro"},
 {k:"Chapter one",b:"Some people arrive<br>quietly.",s:"And change everything."},
 {b:"Before you, I thought<br>I understood love."},
 {b:"Then you showed me<br>what it <em>really</em> means."},
 M("The day you became my favourite hello.","I still remember exactly how it felt.","linear-gradient(160deg,#f3b9a3,#d9668a 55%,#34204f)"),
 {k:"Chapter two",b:"Loving you is the<br>easiest thing<br>I have ever done."},
 M("Ordinary days, made extraordinary.","Simply because you were in them.","linear-gradient(160deg,#f1d9a8,#c8748c 55%,#26264f)"),
 {b:"You make me softer.<br>Braver.<br>Better."},
 {s:"You have seen me tired,<br>overthinking, and impossible.<br><br>And you never once<br>stopped choosing me."},
 M("Late nights and long talks.","When time didn't matter at all.","linear-gradient(160deg,#a9cdf0,#8468c4 55%,#1b2148)"),
 {k:"Chapter three",q:"“Home was never a place.<br>It was always going to be a person.<br>It is you.”"},
 M("Us. Only us.","Still my favourite place to be.","linear-gradient(160deg,#f3c1cf,#d85f8b 55%,#3d1a4b)"),
 {t:"letter"},
 {t:"final"}
];
const D=[0,6500,4500,5500,6500,6000,6500,5000,8000,6500,8000,6500,0,0];

const stage=document.getElementById("stage");
const words=h=>h.split("<br>").map(l=>l.split(" ").map((w,i)=>`<span class="w" style="animation-delay:${.2+i*.16}s">${w}</span>`).join(" ")).join("<br>");
const el=h=>{const s=document.createElement("section");s.className="scene";s.innerHTML=h;stage.appendChild(s);return s};
const nodes=S.map(x=>{
 if(x.t==="intro")return el(`<div class="box"><div class="seal">${HEART}</div><div class="kicker">This is for you</div><div class="script">${NAME}</div><button id="start" style="margin-top:34px">Begin</button></div>`);
 if(x.t==="m")return el(`<div class="mem"><div class="card"><div class="arch" style="--g:${x.g}">${x.p?`<img src="${x.p}" alt="">`:HEART}</div></div><div class="cap">${x.cap}</div><div class="note">${x.note}</div></div>`);
 if(x.t==="letter"){const L=[`${NAME},`,"if I could give you one gift,","it would be the ability to see yourself","the way I see you.","","You are my calm, my laughter,","and my favourite part of every day.","","I love you more than I know how to say."];
  return el(`<div class="box letter">${L.map((l,i)=>l?`<p style="animation-delay:${.4+i*1.1}s">${l}</p>`:"").join("")}</div>`)}
 if(x.t==="final")return el(`<div class="box"><svg class="cons" viewBox="0 0 100 90"><path d="M50 84 C10 56 4 32 20 18 C34 8 46 16 50 28 C54 16 66 8 80 18 C96 32 90 56 50 84Z"/></svg><div class="script" style="font-size:clamp(64px,17vw,120px)">${NAME}</div><div class="fin">I love you.<br><em>Today, tomorrow, always.</em></div>${FROM?`<div class="hint">${FROM}</div>`:""}<button id="again" style="margin-top:26px">Watch again</button></div>`);
 return el(`<div class="box">${x.k?`<div class="kicker">${x.k}</div><div class="rule"></div>`:""}${x.b?`<div class="big">${words(x.b)}</div>`:""}${x.q?`<div class="quote">${x.q}</div>`:""}${x.s?`<div class="mid">${x.s}</div>`:""}</div>`);
});

const dust=document.getElementById("dust");
for(let i=0;i<32;i++){const d=document.createElement("div");d.className="d";d.style.left=Math.random()*100+"%";d.style.animationDuration=10+Math.random()*14+"s";d.style.animationDelay=-Math.random()*20+"s";dust.appendChild(d)}

const next=document.getElementById("next"),back=document.getElementById("back"),bar=document.querySelector("#line i"),snd=document.getElementById("snd");
let cur=-1,timer,audio=null;
function go(i){
 i=Math.max(0,Math.min(S.length-1,i));
 nodes.forEach((n,k)=>n.classList.toggle("on",k===i));
 bar.style.width=(i/(S.length-1)*100)+"%";
 cur=i;
 back.hidden=i===0;
 next.hidden=i===0||i===S.length-1;
 clearTimeout(timer);
 if(i>0&&D[i])timer=setTimeout(()=>go(cur+1),D[i]);
 if(S[i].t==="letter")timer=setTimeout(()=>go(cur+1),13500);
}
next.onclick=()=>go(cur+1);
back.onclick=()=>go(cur-1);
document.getElementById("start").onclick=()=>{
 if(MUSIC&&!audio){audio=new Audio(MUSIC);audio.loop=true;audio.volume=.6;audio.play().catch(()=>{});snd.hidden=false;snd.textContent="Music on"}
 go(1)};
document.getElementById("again").onclick=()=>go(0);
snd.onclick=()=>{if(!audio)return;if(audio.paused){audio.play();snd.textContent="Music on"}else{audio.pause();snd.textContent="Music off"}};
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight"||(e.key===" "&&cur>0)){e.preventDefault();if(cur<S.length-1)go(cur+1)}
 if(e.key==="ArrowLeft")go(cur-1);
});
let tx=null;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;
 if(cur>0&&Math.abs(d)>50)go(cur+(d<0?1:-1))},{passive:true});
go(0);
</script>
</body>
</html>
